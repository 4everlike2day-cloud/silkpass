# Автосборка и выкладка сайта welcome2.uz на Cloudflare Pages.
# Запускается:
#   - при push в main (изменения в папке web/)
#   - при Publish в админке Sanity (вебхук -> repository_dispatch "sanity-publish")
#   - вручную: GitHub -> Actions -> Deploy site -> Run workflow
#
# Нужно в GitHub -> Settings -> Secrets and variables -> Actions:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: SANITY_PROJECT_ID

name: Deploy site

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy out --project-name welcome2 --branch main
